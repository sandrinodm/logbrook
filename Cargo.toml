[package]
name = "logbrook"
version = "0.2.0"
edition = "2024"
description = "Self-hosted log search with DuckDB and Parquet"
license = "MIT"
publish = false

[workspace]
members = ["xtask"]
resolver = "3"
default-members = ["."]

[dependencies]
axum = { version = "0.8", features = ["json", "query", "http1", "tokio"] }
base64 = "0.23.1"
clap = { version = "4.5", features = ["derive"] }
duckdb = { version = "1.20000.1", features = ["bundled", "json", "parquet"] }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.4.3"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rmp = "0.8"
rustix = { version = "1", features = ["process"] }
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.11.1"
subtle = "2"
thiserror = "2.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Application code stays safe Rust; native code is isolated in dependencies.
[lints.rust]
unsafe_code = "forbid"

# Keep stdout machine-readable and avoid panics on a closed output pipe.
[lints.clippy]
disallowed_macros = "deny"
