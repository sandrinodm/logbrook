name: Verify
on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify for a release
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo build --locked --package logbrook
          cargo test --workspace --locked --all-targets
      - name: Verify dependency notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo fetch --locked
          cargo xtask notices --check
  pino-example:
    name: Check Pino logger example
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/pino-logger/package-lock.json
      - name: Test Pino logger example
        working-directory: examples/pino-logger
        run: |
          npm ci
          npm run format:check
          npm test
  packaging:
    name: Package ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain for development checks
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build native release container and attestations
        run: |
          version=$(cargo xtask version)
          commit=$(git rev-parse HEAD)
          docker buildx create --name packaging --driver docker-container --use
          build_args=(
            --platform linux/${{ matrix.architecture }}
            --progress plain
            --build-arg "VCS_REF=$commit"
            --build-arg "VERSION=$version"
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          )
          docker buildx build "${build_args[@]}" \
            --sbom=true --provenance=mode=max \
            --metadata-file /tmp/package-metadata.json \
            --output type=oci,dest=/tmp/logbrook-${{ matrix.architecture }}.tar .
          docker buildx build "${build_args[@]}" --load -t logbrook:ci .

          # Attested OCI exports contain an index rather than one image manifest.
          archive=/tmp/logbrook-${{ matrix.architecture }}.tar
          index=$(jq -er '."containerimage.digest"' /tmp/package-metadata.json)
          manifest=$(tar -xOf "$archive" "blobs/sha256/${index#sha256:}" | jq -er \
            --arg arch '${{ matrix.architecture }}' \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
          expected=$(tar -xOf "$archive" "blobs/sha256/${manifest#sha256:}" | jq -er '.config.digest')
          actual=$(docker image inspect logbrook:ci --format '{{.Id}}')
          test "$expected" = "$actual"
      - name: Check release image size and user
        run: cargo xtask image-inspect --image logbrook:ci --max-image-mib 110
      - name: Smoke test packaged API, Parquet, and restart
        run: cargo xtask container-smoke --image logbrook:ci
      - name: Verify packaged management CLI
        run: cargo xtask check-cli --image logbrook:ci
      - name: Verify container index-load lifecycle
        run: cargo xtask index-load --image logbrook:ci --duration 2 --rate 200 --query-rate 10 --output artifacts/index-smoke.json
      - name: Upload OCI image with SBOM and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logbrook-${{ matrix.architecture }}-oci
          path: /tmp/logbrook-${{ matrix.architecture }}.tar
          retention-days: 7
