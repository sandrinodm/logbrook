name: Verify
on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify for a release
        required: true
        type: string
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust components
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo build --workspace --locked --all-targets
          cargo test --workspace --locked --all-targets
      - name: Verify pinned Forward clients against the native receiver
        run: >-
          python3 tests/tools/forward_interop.py
          --binary target/debug/logbrook
          --host 127.0.0.1 --network host
          --output artifacts/forward/interop-linux.json
      - name: Verify corrupted ACKs fail client qualification
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for client in ["fluentd", "fluentbit"]:
              output = Path(f"artifacts/forward/negative-ack-{client}.json")
              result = subprocess.run([
                  "python3", "tests/tools/forward_interop.py",
                  "--binary", "target/debug/logbrook",
                  "--host", "127.0.0.1", "--network", "host",
                  "--negative-control", client, "--output", str(output),
              ], check=False)
              report = json.loads(output.read_text())
              case = f"{client}_gzip_ack"
              detected = report["cases"].get(case, {})
              if not (
                  result.returncode == 1 and not report["passed"]
                  and report.get("failed_case") == case
                  and report["negative_control"]["responses_corrupted"] > 0
                  and (detected.get("sender_error_detected") or detected.get("sender_repeated_chunk"))
                  and report["cleanup"]["native_exit_code"] == 0
                  and report["cleanup"]["temporary_data_removed"]
                  and not report["cleanup"]["errors"]
              ):
                  raise SystemExit(f"corrupted {client} ACKs were not detected with clean fixture shutdown")
          PY
      - name: Upload Forward interoperability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forward-interop-linux
          path: artifacts/forward/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify dependency notices
        run: |
          cargo install cargo-about --version 0.9.3 --locked --features cli
          cargo fetch --locked
          cargo xtask notices --check
  pino-example:
    name: Check Pino logger example
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: examples/pino-logger/package-lock.json
      - name: Test Pino logger example
        working-directory: examples/pino-logger
        run: |
          npm ci
          npm run format:check
          npm test
  packaging:
    name: Package ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain for development checks
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build native release container and attestations
        run: |
          version=$(cargo xtask version)
          commit=$(git rev-parse HEAD)
          docker buildx create --name packaging --driver docker-container --use
          build_args=(
            --platform linux/${{ matrix.architecture }}
            --progress plain
            --build-arg "VCS_REF=$commit"
            --build-arg "VERSION=$version"
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          )
          docker buildx build "${build_args[@]}" \
            --sbom=true --provenance=mode=max \
            --metadata-file /tmp/package-metadata.json \
            --output type=oci,dest=/tmp/logbrook-${{ matrix.architecture }}.tar .
          docker buildx build "${build_args[@]}" --load -t logbrook:ci .

          # Attested OCI exports contain an index rather than one image manifest.
          archive=/tmp/logbrook-${{ matrix.architecture }}.tar
          index=$(jq -er '."containerimage.digest"' /tmp/package-metadata.json)
          manifest=$(tar -xOf "$archive" "blobs/sha256/${index#sha256:}" | jq -er \
            --arg arch '${{ matrix.architecture }}' \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
          expected=$(tar -xOf "$archive" "blobs/sha256/${manifest#sha256:}" | jq -er '.config.digest')
          actual=$(docker image inspect logbrook:ci --format '{{.Id}}')
          test "$expected" = "$actual"
      - name: Check release image size and user
        run: cargo xtask image-inspect --image logbrook:ci --max-image-mib 110
      - name: Smoke test packaged API, Parquet, and restart
        run: cargo xtask container-smoke --image logbrook:ci
      - name: Verify packaged management CLI
        run: cargo xtask check-cli --image logbrook:ci
      - name: Verify container index-load lifecycle
        run: cargo xtask index-load --image logbrook:ci --duration 2 --rate 200 --query-rate 10 --output artifacts/index-smoke.json
      - name: Upload OCI image with SBOM and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logbrook-${{ matrix.architecture }}-oci
          path: /tmp/logbrook-${{ matrix.architecture }}.tar
          retention-days: 7
  ui-packaging:
    name: Package UI ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain for development checks
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build native UI container and attestations
        run: |
          version=$(cargo xtask version)
          commit=$(git rev-parse HEAD)
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker buildx create --name ui-packaging --driver docker-container --use
          build_args=(
            --platform linux/${{ matrix.architecture }}
            --progress plain
            --build-arg "VCS_REF=$commit"
            --build-arg "VERSION=$version"
            --label "org.opencontainers.image.source=$source"
          )
          docker buildx build "${build_args[@]}" \
            --sbom=true --provenance=mode=max \
            --metadata-file /tmp/ui-package-metadata.json \
            --output type=oci,dest=/tmp/logbrook-ui-${{ matrix.architecture }}.tar ui
          docker buildx build "${build_args[@]}" --load -t logbrook-ui:ci ui

          # Attested OCI exports contain an index rather than one image manifest.
          archive=/tmp/logbrook-ui-${{ matrix.architecture }}.tar
          index=$(jq -er '."containerimage.digest"' /tmp/ui-package-metadata.json)
          manifest=$(tar -xOf "$archive" "blobs/sha256/${index#sha256:}" | jq -er \
            --arg arch '${{ matrix.architecture }}' \
            '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
          expected=$(tar -xOf "$archive" "blobs/sha256/${manifest#sha256:}" | jq -er '.config.digest')
          actual=$(docker image inspect logbrook-ui:ci --format '{{.Id}}')
          test "$expected" = "$actual"

          # The image carries the release metadata the publication relies on.
          labels=$(docker image inspect logbrook-ui:ci --format '{{json .Config.Labels}}')
          jq -e --arg commit "$commit" --arg version "$version" --arg source "$source" \
            '.["org.opencontainers.image.revision"] == $commit
             and .["org.opencontainers.image.version"] == $version
             and .["org.opencontainers.image.source"] == $source' <<< "$labels"
          test "$(docker image inspect logbrook-ui:ci --format '{{.Architecture}}')" = '${{ matrix.architecture }}'
      - name: Smoke test the UI container
        run: bash .github/scripts/ui-container-smoke.sh logbrook-ui:ci
      - name: Upload UI OCI image with SBOM and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logbrook-ui-${{ matrix.architecture }}-oci
          path: /tmp/logbrook-ui-${{ matrix.architecture }}.tar
          retention-days: 7
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Install pnpm
        run: npm install --global pnpm@12.1.0
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Check formatting, lint, types and JSDoc
        working-directory: ui
        run: pnpm check
      - name: Unit tests
        working-directory: ui
        run: pnpm test
      - name: Lint React
        working-directory: ui
        run: pnpm lint:react
      - name: Build
        working-directory: ui
        run: pnpm build
      - name: Install Chromium for the browser tests
        working-directory: ui
        run: pnpm exec e2e-web install chromium --with-deps
      - name: Build the Logbrook binary the e2e tests start
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo build --locked --bin logbrook
      - name: Integration and browser tests against a real Logbrook
        working-directory: ui
        env:
          E2E_TELEMETRY_DISABLED: '1'
        run: pnpm test:e2e
      - name: Every e2e test ran and passed
        working-directory: ui
        # The runner also exits 0 when a test is skipped or flaky.
        run: |
          node -e "const s=require('./.e2e/report.json').run.summary;if(!s.selected||s.selected!==s.discovered||s.passed!==s.selected||s.failed||s.skipped||s.flaky||s.interrupted){console.error(s);process.exit(1)}"
      - name: Upload the e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-report
          path: ui/.e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: The e2e tests left no process behind
        if: always()
        run: |
          left=0
          if pgrep --list-full --full 'dev-logbrook|target/debug/logbrook|\.output/server|chrome-headless-shell|e2e/dist/run/worker'; then
            echo "A test process was left running"
            left=1
          fi
          if ls -d "$(node -p 'require("os").tmpdir()')"/logbrook-ui-it-* 2>/dev/null; then
            echo "A test directory was left behind"
            left=1
          fi
          exit "$left"
