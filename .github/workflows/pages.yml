name: Docs site
on:
  push:
    branches: [docs-site]
  pull_request:
    branches: [docs-site]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # "Last updated" dates and the sitemap come from git history.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the Logbrook source for its OpenAPI spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: _logbrook
          sparse-checkout: src/openapi.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use the API spec from main
        run: |
          cp _logbrook/src/openapi.json src/api/openapi.json
          rm -rf _logbrook
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the site
        run: npx @cloudflare/nimbus-docs check
      - run: npm run build
      - name: Check links after the build
        run: npx @cloudflare/nimbus-docs check
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
